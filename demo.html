<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>info-popup 演示：团队成员</title>
<style>
  :root { --accent: #E8F0FE; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Inter, -apple-system, "Segoe UI", sans-serif; background: #FFFFFF; color: #0A0A0A; }
  header { padding: 40px 24px 0; text-align: center; }
  header h1 { font-family: "Space Grotesk", sans-serif; font-size: 28px; margin: 0 0 8px; }
  header p { color: #6B7280; margin: 0 0 24px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px; max-width: 720px; margin: 0 auto; padding: 0 24px 64px;
  }
  .person {
    border: 1px solid #E7E7E7; border-radius: 10px; background: #FFFFFF;
    padding: 20px 14px; cursor: pointer; text-align: center;
    font-family: inherit; color: #0A0A0A;
    transition: background .15s ease, border-color .15s ease;
  }
  .person:hover, .person:focus-visible { background: var(--accent); border-color: #B9CDF6; outline: none; }
  .person .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 8px; background: #F3F4F6; }
  .person .pname { font-weight: 600; font-size: 15px; }
  .person .prole { display: block; font-size: 12px; color: #6B7280; margin-top: 2px; }
</style>
</head>
<body>
<header>
  <h1>团队成员</h1>
  <p>点击任意成员查看档案（背景模糊）</p>
</header>

<div class="grid" id="grid"></div>
<script src="info-popup.js"></script>
<script>

  const pic = 'pic/potato.jpeg';

  const members = [
    { name: '研发中心', type: 'dept', pic, dept: '总部',
      reportsTo: [],
      info: [
        { type: '办公地点', value: '北京 · 上海' },
        { type: '成立时间', value: '2018-01' },
      ],
      profile: '负责公司核心产品的研发与交付。' },
    { name: '前端组', type: 'dept', pic, dept: '研发中心',
      reportsTo: ['研发中心'],
      info: [
        { type: '办公地点', value: '北京' },
        { type: '成立时间', value: '2019-06' },
      ],
      profile: '负责 Web 与移动端的界面研发。' },
    { name: '后端组', type: 'dept', pic, dept: '研发中心',
      reportsTo: ['研发中心'],
      info: [
        { type: '办公地点', value: '北京' },
        { type: '成立时间', value: '2019-06' },
      ],
      profile: '负责服务端与数据平台。' },
    { name: '李然', type: 'person', pic, dept: '前端组', id: 'ENG-014',
      reportsTo: ['研发中心', '前端组'],
      info: [
        { type: '职位', value: '前端工程师' },
        { type: '办公地点', value: ['北京', '远程'] },
        { type: '入职时间', value: '2021-03' },
      ],
      profile: '负责组件库与前端工程化，关注可访问性与性能。' },
    { name: '王璐', type: 'person', pic, dept: '前端组', id: 'DSN-007',
      reportsTo: ['研发中心', '前端组'],
      info: [
        { type: '职位', value: 'UI 设计师' },
        { type: '办公地点', value: '上海' },
        { type: '入职时间', value: '2020-09' },
      ],
      profile: '负责产品界面与设计系统，注重简洁与一致性。' },
    { name: '张昊', type: 'person', pic, dept: '后端组', id: 'ENG-021',
      reportsTo: ['研发中心', '后端组'],
      info: [
        { type: '职位', value: '后端工程师' },
        { type: '办公地点', value: '北京' },
        { type: '入职时间', value: '2022-01' },
      ],
      profile: '负责 API 与数据服务，关注稳定性与可观测性。' },
  ];

  const grid = document.getElementById('grid');

  for (const m of members) {
    const btn = document.createElement('button');
    btn.className = 'person';
    btn.type = 'button';

    const img = document.createElement('img');
    img.className = 'avatar';
    img.src = m.pic;
    img.alt = m.name;

    const name = document.createElement('span');
    name.className = 'pname';
    name.textContent = m.name;

    const role = document.createElement('span');
    role.className = 'prole';
    role.textContent = m.dept;

    btn.append(img, name, role);
    btn.addEventListener('click', () => infoPopup.show(m));
    grid.append(btn);
  }
</script>
</body>
</html>

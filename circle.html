<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三个圆形对象</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; justify-content: center; align-items: center;
      background: #f0f2f5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .circle-row { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; padding: 20px; }
    .circle {
      width: 140px; height: 140px; border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
      color: #fff; font-size: 18px; font-weight: 600; letter-spacing: 1px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer; user-select: none;
    }
    .circle:hover { transform: translateY(-6px) scale(1.06); box-shadow: 0 14px 28px rgba(0, 0, 0, 0.22); }
    .circle:focus-visible { outline: 3px solid #e8f0fe; outline-offset: 4px; }
    .circle-1 { background: linear-gradient(135deg, #ff6b6b, #ee2b47); }
    .circle-2 { background: linear-gradient(135deg, #4facfe, #0066ff); }
    .circle-3 { background: linear-gradient(135deg, #43e97b, #22a45d); }
  </style>
</head>
<body>

  <div class="circle-row">
    <div class="circle circle-1" tabindex="0" role="button"
      data-info-popup='{"name":"红色圆形","info":[{"type":"编号","value":"1"},{"type":"颜色","value":"红色"},{"type":"尺寸","value":"140 × 140"}],"profile":"第一个圆形对象，红橙渐变。"}'>1</div>

    <div class="circle circle-2" tabindex="0" role="button"
      data-info-popup='{"name":"蓝色圆形","info":[{"type":"编号","value":"2"},{"type":"颜色","value":"蓝色"},{"type":"尺寸","value":"140 × 140"}],"profile":"第二个圆形对象，蓝色渐变。"}'>2</div>

    <div class="circle circle-3" tabindex="0" role="button"
      data-info-popup='{"name":"绿色圆形","info":[{"type":"编号","value":"3"},{"type":"颜色","value":"绿色"},{"type":"尺寸","value":"140 × 140"}],"profile":"第三个圆形对象，绿色渐变。"}'>3</div>
  </div>

  <script src="info-popup.js"></script>
</body>
</html>
